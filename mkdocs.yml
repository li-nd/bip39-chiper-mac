site_name: Bip39Chiper
site_description: Offline macOS utility to obfuscate BIP-39 seed phrases into codes you can store separately from your password
site_url: https://chiper.developer.pm/
repo_url: https://github.com/li-nd/bip39-chiper-mac
repo_name: li-nd/bip39-chiper-mac
copyright: Copyright © 2026 Markus Lind

theme:
  name: material
  logo: logo.png
  favicon: logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
  - Security: security.md
  - Algorithm specification: algorithm-spec.md
  - Test vectors: test-vectors.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - tables
  - admonition
  - github-callouts
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/li-nd/bip39-chiper-mac
